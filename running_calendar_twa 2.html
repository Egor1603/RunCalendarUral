<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Беговые события — Свердловская область</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0e0e12;
    --bg2: #17171d;
    --bg3: #1e1e27;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f4;
    --muted: #7a7a8a;
    --accent: #5b8ef0;
    --trail: #3ecf8e;
    --road: #5b8ef0;
    --night: #a78bfa;
    --trail-bg: rgba(62,207,142,0.1);
    --road-bg: rgba(91,142,240,0.1);
    --night-bg: rgba(167,139,250,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: env(safe-area-inset-bottom, 24px); }
  body.tg-light { --bg: #f4f4f8; --bg2: #ffffff; --bg3: #ebebf0; --border: rgba(0,0,0,0.08); --text: #0e0e12; --muted: #7a7a8a; }
  .header { padding: 20px 16px 12px; position: sticky; top: 0; z-index: 10; background: var(--bg); }
  .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .logo { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo svg { width: 18px; height: 18px; }
  .header-title { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .header-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .divider { height: 0.5px; background: var(--border); margin: 12px 0 0; }
  .filters-wrap { padding: 12px 16px 0; position: sticky; top: 72px; z-index: 9; background: var(--bg); }
  .filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 12px; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--bg2); color: var(--muted); font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.18s; user-select: none; }
  .chip.active-all   { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.active-trail { background: var(--trail-bg); border-color: var(--trail); color: var(--trail); }
  .chip.active-road  { background: var(--road-bg);  border-color: var(--road);  color: var(--road); }
  .chip.active-night { background: var(--night-bg); border-color: var(--night); color: var(--night); }
  .count-row { padding: 0 16px 8px; font-size: 12px; color: var(--muted); }
  .calendar { padding: 0 16px 24px; }
  .month-block { margin-bottom: 24px; }
  .month-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .event-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 8px; cursor: pointer; transition: transform 0.12s, background 0.12s; display: block; }
  .event-card:active { transform: scale(0.98); background: var(--bg3); }
  .event-card-inner { display: flex; gap: 12px; align-items: flex-start; }
  .date-block { background: var(--bg3); border-radius: 10px; padding: 6px 8px; text-align: center; flex-shrink: 0; min-width: 44px; }
  .date-day { font-size: 18px; font-weight: 700; color: var(--text); line-height: 1; }
  .date-mon { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; }
  .event-info { flex: 1; min-width: 0; }
  .event-name { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 4px; }
  .event-dist { font-size: 12px; color: var(--muted); margin-bottom: 6px; line-height: 1.4; }
  .event-bottom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .city-tag { font-size: 11px; color: var(--muted); }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge-trail { background: var(--trail-bg); color: var(--trail); }
  .badge-road  { background: var(--road-bg);  color: var(--road); }
  .badge-night { background: var(--night-bg); color: var(--night); }
  .arrow { color: var(--muted); font-size: 20px; line-height: 1; align-self: center; margin-left: 4px; flex-shrink: 0; }
  .empty { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 14px; }
  .footer { text-align: center; font-size: 11px; color: var(--muted); padding: 8px 16px 20px; line-height: 1.5; border-top: 0.5px solid var(--border); margin: 0 16px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 2C10 2 5 7 5 12C5 14.76 7.24 17 10 17C12.76 17 15 14.76 15 12C15 7 10 2 10 2Z" fill="white" opacity="0.9"/>
        <path d="M7 13L9.5 10.5L11 12L13.5 9" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <div class="header-title">Бег · Свердловская обл.</div>
      <div class="header-sub">Календарь событий 2026</div>
    </div>
  </div>
  <div class="divider"></div>
</div>

<div class="filters-wrap">
  <div class="filters">
    <button class="chip active-all" onclick="setFilter('all', this)">Все</button>
    <button class="chip" onclick="setFilter('trail', this)">🏔 Трейл</button>
    <button class="chip" onclick="setFilter('road', this)">🏙 Шоссе</button>
    <button class="chip" onclick="setFilter('night', this)">🌙 Ночные</button>
  </div>
</div>

<div class="count-row" id="count-row"></div>
<div class="calendar" id="calendar"></div>
<div class="footer">Данные: ea-m.org · marathonec.ru · begaem.com</div>

<script>
var tg = null;
try {
  if (window.Telegram && window.Telegram.WebApp) {
    tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.colorScheme === 'light') document.body.classList.add('tg-light');
  }
} catch(e) {}

var events = [
  { day: '26', mon: 'апр', month: 'Апрель', name: 'Майская гроза', city: 'Екатеринбург', distances: '5 км, 10 км, детский забег', type: 'road', url: 'https://ea-m.org/maystormrace2026' },
  { day: '15', mon: 'май', month: 'Май', name: 'Бэкъярд на Шарташе', city: 'Екатеринбург', distances: '6,7 км (до последнего участника)', type: 'trail', url: 'https://myrace.info/events/1629' },
  { day: '16', mon: 'май', month: 'Май', name: 'Hard Run Hill — забег на трамплин', city: 'Екатеринбург', distances: 'Вертикальный километр', type: 'trail', url: 'https://ea-m.org/hardrunhill2026' },
  { day: '29', mon: 'май', month: 'Май', name: 'Первоуральск Опен — Весна', city: 'Первоуральск', distances: '5, 10, 15, 30, 40, 55, 71, 100 км', type: 'trail', url: 'https://reg.russiarunning.com/event/PervouralskOpen2026Vesna' },
  { day: '6',  mon: 'июн', month: 'Июнь', name: 'Sahara Trail', city: 'Екатеринбург', distances: '5, 10, 15 км', type: 'trail', url: 'https://marathonec.ru/sahara-trail/' },
  { day: '6',  mon: 'июн', month: 'Июнь', name: 'Kamensk Urban Trail', city: 'Каменск-Уральский', distances: '3, 10, 14, 20 км', type: 'trail', url: 'https://myrace.info/events/1637' },
  { day: '7',  mon: 'июн', month: 'Июнь', name: 'Тагил ультра трейл', city: 'Нижний Тагил', distances: '5, 10, 21, 65 км', type: 'trail', url: 'https://myrace.info/events/1716' },
  { day: '12', mon: 'июн', month: 'Июнь', name: 'Бисертский марафон', city: 'Бисерть', distances: '5, 10, 42 км', type: 'road', url: 'https://reg.russiarunning.com/event/VIIBisertskiymarafon12062026g' },
  { day: '20', mon: 'июн', month: 'Июнь', name: 'Ночной полумарафон «Серые ночи»', city: 'Екатеринбург', distances: '10, 21,1 км + детский', type: 'night', url: 'https://ea-m.org/greynight2026' },
  { day: '4',  mon: 'июл', month: 'Июль', name: 'Горный марафон «Конжак»', city: 'Краснотурьинск', distances: '42 км (горная трасса)', type: 'trail', url: 'https://marathonec.ru/gornyj-marafon-konzhak-2/' },
  { day: '12', mon: 'июл', month: 'Июль', name: 'Трейл «Шигирский идол»', city: 'Дегтярск', distances: '10, 21 км + детский', type: 'trail', url: 'https://ea-m.org/shidoltrail2026' },
  { day: '9',  mon: 'авг', month: 'Август', name: 'XI Марафон «Европа-Азия»', city: 'Екатеринбург', distances: '3, 10, 21,1, 42,2 км', type: 'road', url: 'https://ea-m.org/eamarathon2026' },
  { day: '12', mon: 'сен', month: 'Сентябрь', name: 'Ночной забег Laser Night Run', city: 'Екатеринбург', distances: '3, 10 км', type: 'night', url: 'https://ea-m.org/lasernightrun-2026' },
  { day: '6',  mon: 'дек', month: 'Декабрь', name: 'Зимний полумарафон «Европа-Азия»', city: 'Екатеринбург', distances: '7, 21,1 км + детский', type: 'road', url: 'https://ea-m.org/winterhalfmarathon-2026' }
];

var monthOrder = ['Апрель','Май','Июнь','Июль','Август','Сентябрь','Декабрь'];
var currentFilter = 'all';

function setFilter(type, el) {
  currentFilter = type;
  var chips = document.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++) chips[i].className = 'chip';
  el.className = 'chip active-' + type;
  render();
}

function openUrl(url) {
  try { if (tg) { tg.openLink(url); return; } } catch(e) {}
  window.open(url, '_blank');
}

function plural(n, one, few, many) {
  var mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
  return many;
}

function escUrl(url) {
  return url.replace(/'/g, "\\'");
}

function render() {
  var filtered = currentFilter === 'all' ? events : events.filter(function(e) { return e.type === currentFilter; });
  document.getElementById('count-row').textContent = filtered.length + ' ' + plural(filtered.length, 'событие', 'события', 'событий');

  var byMonth = {};
  for (var i = 0; i < monthOrder.length; i++) byMonth[monthOrder[i]] = [];
  for (var j = 0; j < filtered.length; j++) {
    var e = filtered[j];
    if (byMonth[e.month] !== undefined) byMonth[e.month].push(e);
  }

  var cal = document.getElementById('calendar');
  cal.innerHTML = '';
  var hasContent = false;

  for (var m = 0; m < monthOrder.length; m++) {
    var month = monthOrder[m];
    var evs = byMonth[month];
    if (!evs.length) continue;
    hasContent = true;

    var block = document.createElement('div');
    block.className = 'month-block';
    var html = '<div class="month-label">' + month + '</div>';
    var labels = { trail: 'трейл', road: 'шоссе', night: 'ночной' };

    for (var k = 0; k < evs.length; k++) {
      var ev = evs[k];
      html += '<div class="event-card" onclick="openUrl(\'' + escUrl(ev.url) + '\')">'
        + '<div class="event-card-inner">'
        + '<div class="date-block"><div class="date-day">' + ev.day + '</div><div class="date-mon">' + ev.mon + '</div></div>'
        + '<div class="event-info">'
        + '<div class="event-name">' + ev.name + '</div>'
        + '<div class="event-dist">' + ev.distances + '</div>'
        + '<div class="event-bottom">'
        + '<span class="city-tag">' + ev.city + '</span>'
        + '<span class="badge badge-' + ev.type + '">' + labels[ev.type] + '</span>'
        + '</div></div>'
        + '<div class="arrow">›</div>'
        + '</div></div>';
    }

    block.innerHTML = html;
    cal.appendChild(block);
  }

  if (!hasContent) {
    cal.innerHTML = '<div class="empty">Событий не найдено</div>';
  }
}

render();
</script>
</body>
</html>
